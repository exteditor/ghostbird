<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostbird Demo</title>
    <script type="module" src="../dist/testbench/main.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        padding: 2rem;
        background: #eee;
      }

      ghostbird-testbench {
        display: block;
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        padding: 2rem;
      }

      h1 {
        margin-bottom: 2rem;
        color: #333;
      }

      menu {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      button {
        padding: 1rem 2rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      .startButton {
        background: #494;
        color: white;
      }

      .startButton:hover {
        background: #4a4;
      }

      .stopButton {
        background: #d10;
        color: white;
      }

      .stopButton:hover {
        background: #f43;
      }

      .stopButton:disabled,
      .startButton:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      .panel {
        display: flex;
        flex-direction: column;
      }

      .panel h2 {
        margin-bottom: 1rem;
        color: #666;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        background: white;
      }

      textarea {
        width: 100%;
        height: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 0.5rem;
        font-family: monospace;
        resize: vertical;
      }

      @media (max-width: 768px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <ghostbird-testbench>
      <h1>Ghostbird Testbench</h1>
      <main>
        <div class="panel">
          <h2>Thunderbird Compose Window</h2>
          <iframe
            class="composeWindow"
            sandbox="allow-same-origin"
            srcdoc="Initial text from compose window"
            title="Thunderbird compose window"
            aria-label="Thunderbird compose window"
          ></iframe>
        </div>
        <div class="panel">
          <h2>Text Editor</h2>
          <textarea
            class="externalEditor"
            aria-label="Text editor"
            disabled
          ></textarea>
        </div>
      </main>
      <menu>
        <button class="startButton">Start syncing</button>
        <button class="stopButton" disabled>Stop syncing</button>
      </menu>
    </ghostbird-testbench>
  </body>
</html>
